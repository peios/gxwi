side_effects = ["man-db"]

[package]
name = "dev.peios.gxwi"
description = "Peios web display server and demonstration application"
license = "(((MIT OR Apache-2.0) AND Unicode-3.0) AND Apache-2.0 AND (Apache-2.0 OR BSD-2-Clause OR MIT) AND (Apache-2.0 OR BSL-1.0) AND (Apache-2.0 OR MIT) AND BSD-3-Clause AND ISC AND MIT AND (MIT AND BSD-3-Clause) AND (MIT OR Unlicense)) AND OFL-1.1"

[dependencies]
"dev.peios.libpeios" = ">= 0.5.8-1"
"org.gnu.glibc" = "*"
"org.gnu.gcc-libgcc" = "*"
"dev.peios.authd" = ">= 0.0.22-1"
"dev.peios.peinit" = ">= 0.0.9-1"

[files]
":usr/share/man/man1/**" = "usr/share/man/man1"
"@source:LICENSE" = "usr/share/licenses/dev.peios.gxwi/LICENSE"
":licenses/**" = "usr/share/licenses/dev.peios.gxwi/third-party"
"@source:gxwi-server/src/fonts/*.LICENSE" = "usr/share/licenses/dev.peios.gxwi/fonts"
":usr/bin/**" = "usr/bin"
":usr/share/regim/**" = "usr/share/regim"
":usr/share/regman/**" = "usr/share/regman"
":usr/share/icons/**" = "usr/share/icons"
":usr/share/apps/**" = "usr/share/apps"

[sd_overrides]
"usr/bin/gxwi-server" = "O:SYG:SYD:(A;;GA;;;SY)(A;;GA;;;BA)(A;;GRGX;;;WD)(A;;GRGX;;;S-1-15-3-165089264-3223449312-1247726440-2294222582-3667604814-1924088670-4213972040-4159405878)"
