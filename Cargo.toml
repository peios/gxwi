[workspace]
resolver = "3"
members = ["gxwid", "gxwi-server", "gxwi-channel", "gxwi-hello", "libgxwi"]
exclude = ["fuzz"]

[workspace.package]
version = "0.0.2"
edition = "2024"
license = "MIT"
publish = false

[workspace.dependencies]
axum = "0.8.9"
gxwi-channel = { path = "gxwi-channel" }
hyper = { version = "1.11", features = ["client", "http2"] }
hyper-util = { version = "0.1.20", features = ["tokio"] }
libc = "0.2"
# First-party Rust dependencies are pinned to immutable commits.
libauthd = { git = "https://github.com/peios/authd.git", rev = "c55729620da3e301c33a8b582f9aa3adab278ee0", package = "libauthd" }
peios = { git = "https://github.com/peios/peios-rs.git", rev = "fa833541e1837042765072f092140f4af683edc2", package = "peios" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net", "io-util", "time"] }
toml = "0.9"
