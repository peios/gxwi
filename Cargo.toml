[workspace]
resolver = "3"
members = ["gxwid", "gxwi-server", "gxwi-channel", "gxwi-hello", "libgxwi"]
exclude = ["fuzz"]

[workspace.package]
version = "0.0.2"
edition = "2024"
license = "MIT"
publish = false

[workspace.dependencies]
axum = "0.8.9"
gxwi-channel = { path = "gxwi-channel" }
hyper = { version = "1.11", features = ["client", "http2"] }
hyper-util = { version = "0.1.20", features = ["tokio"] }
libc = "0.2"
# First-party Rust dependencies are pinned to immutable commits.
libauthd = { git = "https://github.com/peios/authd.git", rev = "3aec2905a4e0bcbe7a4fd07682fb328847d6fc18", package = "libauthd" }
peios = { git = "https://github.com/peios/peios-rs.git", rev = "3dffee949a457509078ffc2f423613de330b5401", package = "peios" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net", "io-util", "time"] }
toml = "0.9"
