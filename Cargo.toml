[workspace]
resolver = "3"
members = ["gxwid", "gxwi-server"]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "MIT"
publish = false

[workspace.dependencies]
axum = "0.8.9"
libc = "0.2"
# First-party Rust dependencies are pinned to immutable commits.
peios = { git = "https://github.com/peios/peios-rs.git", rev = "f4309f78fbaa878a14429a5e07d778dba9ddfab7", package = "peios" }
sha2 = "0.10"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net"] }
