[package]
name = "gxwi-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

# Not a member of the gxwi workspace: it builds on nightly with its own lock.
[workspace]

[dependencies]
libfuzzer-sys = "0.4"
libauthd = { git = "https://github.com/peios/authd.git", rev = "06f9750350ac727583738bf2e0b2b905464ebfa3", package = "libauthd" }

[[bin]]
name = "relay"
path = "fuzz_targets/relay.rs"
test = false
doc = false
bench = false
