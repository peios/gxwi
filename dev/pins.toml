# The one revision of each sibling repository that every program in the
# graphical stack builds against (PEI-1400). dev/repin.py writes these into
# each program's manifests, in place of a path beside the checkout or an older
# revision, and brings its Cargo.lock along.
#
# Only pushed revisions: Cargo fetches them from GitHub. Every one of them
# must itself pin the peios-rs revision here, because a program can hold only
# one peios-sys (links = "peios").
#
# gxwi is the release commit dev.peios.gxwi-sdk stages libgxwi from (the
# revision in gxwi's packaging/stage-sdk.py), not gxwi's head: a package build
# takes libgxwi from the SDK, and checks the two agree.

[url]
peios-rs = "https://github.com/peios/peios-rs.git"
gxwi = "https://github.com/peios/gxwi.git"
gxwi-sd-editor = "https://github.com/peios/gxwi-sd-editor.git"
gxwi-file-dialog = "https://github.com/peios/gxwi-file-dialog.git"
authd = "https://github.com/peios/authd.git"
peinit = "https://github.com/peios/peinit.git"
peiosutils = "https://github.com/peios/peiosutils.git"
eventd = "https://github.com/peios/eventd.git"
timed = "https://github.com/peios/timed.git"
netd = "https://github.com/peios/netd.git"
resolvd = "https://github.com/peios/resolvd.git"
trustd = "https://github.com/peios/trustd.git"
pkm = "https://github.com/peios/pkm.git"

[rev]
peios-rs = "f8c84930f2b71763bcf0550df0b1420a0f63b21e"
gxwi = "5629140add3de075511b3379fd690fdabd06dcaf"
gxwi-sd-editor = "27239eb3411ab82d711262bfd59e537c66c29e9e"
gxwi-file-dialog = "65b6015e7bc65cdade2e043f31f0b4838106298c"
authd = "1a421053deb0cf9703ee1e109db3792f7e1bb95d"
peinit = "0e20fef16f3c170d8fba0e3a169b617e7b4da3aa"
peiosutils = "67ffede760dc1c5767fbb3c6c66e5fc5e12b7314"
eventd = "3df88bab845d962e866158896807eac2976b83e3"
timed = "c1db503a60108542c8586c574802e5f2339dbcb4"
netd = "23af1f6b84f3764d9327eb009ced56b2a16b7aa8"
resolvd = "9c96d693c9672e635cc40ee1e2ea8122e64f017e"
trustd = "2fd7d86aac00e207320bda1ae11045aec3d61fbf"
pkm = "704c0e37b9794ed422a708120113dda71d4920b9"

# A crate whose revision is another's to choose, by its dependency name, in
# place of its repository's above. pnp-core is the one libnetd's "policy"
# feature pins: Network Manager hands libnetd its snapshots, so the two must
# be one crate. It moves with netd.
[crate]
pnp-core = "17712f8fbf4889696c1c919f17409bc15f16efa0"

# The dev.peios.gxwi-sdk release that stages the gxwi revision above.
[sdk]
version = "0.0.3-1"
